name: Baosi Compressor Data Generator

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to run (comma-separated)'
        required: false
        default: ''
      exclude:
        description: 'Exclude models (comma-separated)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Debug info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner name: ${{ runner.name }}"
          echo "Repo: ${{ github.repository }}"
          echo "SHA: ${{ github.sha }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write proxy file
        run: |
          echo "${{ secrets.PROXY_ADDR }}" > proxy_ok.txt
          echo "Proxy file created with $(wc -l < proxy_ok.txt) lines"

      - name: Run generator
        env:
          BAOSI_MODELS: ${{ inputs.models || '' }}
          BAOSI_EXCLUDE: ${{ inputs.exclude || '' }}
        run: |
          CMD="python src/baosi_gen_probe_human.py --human --proxy proxy_ok.txt"
          if [ -n "$BAOSI_MODELS" ]; then
            CMD="$CMD --models \"$BAOSI_MODELS\""
          fi
          if [ -n "$BAOSI_EXCLUDE" ]; then
            CMD="$CMD --exclude \"$BAOSI_EXCLUDE\""
          fi
          echo "Running: $CMD"
          eval $CMD

      - name: Commit progress
        if: success()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -f baosi_gen_progress.json ]; then
            git config user.name "baosi-bot"
            git config user.email "baosi-bot@users.noreply.github.com"
            git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
            git add compressors_baosi.js baosi_gen_progress.json
            DONE=$(python3 -c "
          import json
          prog = json.load(open('baosi_gen_progress.json'))
          print(sum(1 for v in prog.values() if v in ('done','no-range','no-grid')))
          ")
            git commit -m "data: run #${{ github.run_number }} progress (${DONE} tasks done)" || echo "No changes to commit"
            git push origin main || echo "Push failed"
          fi

      - name: Continue if needed
        if: success()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -f baosi_gen_progress.json ]; then
            TOTAL=$(python3 -c "
          import json
          cat = json.load(open('baosi_catalog.json'))
          count = 0
          for series in cat.values():
              for spec in series.values():
                  for mname, md in spec['models'].items():
                      if 'error' not in md:
                          refrs = [r for r in md.get('refr_names','').split(',') if r in ['R22','R404A','R507','R134a']]
                          count += len(refrs)
          print(count)
          ")
            DONE=$(python3 -c "
          import json
          prog = json.load(open('baosi_gen_progress.json'))
          print(sum(1 for v in prog.values() if v in ('done','no-range','no-grid')))
          ")
            REMAINING=$((TOTAL - DONE))
            echo "Total: $TOTAL, Done: $DONE, Remaining: $REMAINING"
            if [ "$REMAINING" -gt 0 ]; then
              echo "Triggering next run in 6 hours..."
              curl -X POST \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: token $PAT_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/baosi.yml/dispatches" \
                -d '{"ref":"main"}'
            else
              echo "All tasks completed!"
            fi
          fi

      - name: Upload output files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baosi-output-${{ github.run_number }}
          path: |
            compressors_baosi*.js
            baosi_gen_progress*.json
            baosi_gen*.log
            baosi_probe*.log
          retention-days: 30
