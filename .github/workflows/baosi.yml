name: Baosi Compressor Data Generator

on:
  workflow_dispatch:
    inputs:
      models:
        description: '指定型号 (逗号分隔, 留空=全部)'
        required: false
        default: ''
      exclude:
        description: '排除型号 (逗号分隔)'
        required: false
        default: ''
      use_proxy:
        description: '是否使用代理 (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write proxy file
        if: inputs.use_proxy == 'true'
        run: |
          echo "${{ secrets.PROXY_ADDR }}" > proxy_ok.txt
          echo "Proxy file created with $(wc -l < proxy_ok.txt) lines"

      - name: Run generator
        env:
          BAOSI_MODELS: ${{ inputs.models }}
          BAOSI_EXCLUDE: ${{ inputs.exclude }}
          BAOSI_USE_PROXY: ${{ inputs.use_proxy }}
        run: |
          CMD="python src/baosi_gen_probe_human.py --human"
          if [ -n "$BAOSI_MODELS" ]; then
            CMD="$CMD --models \"$BAOSI_MODELS\""
          fi
          if [ -n "$BAOSI_EXCLUDE" ]; then
            CMD="$CMD --exclude \"$BAOSI_EXCLUDE\""
          fi
          if [ "$BAOSI_USE_PROXY" = "true" ]; then
            CMD="$CMD --proxy proxy_ok.txt"
          fi
          eval $CMD

      - name: Continue if needed
        if: success() && inputs.models == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f baosi_gen_progress.json ]; then
            TOTAL=$(python3 -c "
          import json
          cat = json.load(open('baosi_catalog.json'))
          count = 0
          for series in cat.values():
              for spec in series.values():
                  for mname, md in spec['models'].items():
                      if 'error' not in md:
                          refrs = [r for r in md.get('refr_names','').split(',') if r in ['R22','R404A','R507','R134a']]
                          count += len(refrs)
          print(count)
          ")
            DONE=$(python3 -c "
          import json
          prog = json.load(open('baosi_gen_progress.json'))
          print(sum(1 for v in prog.values() if v in ('done','no-range','no-grid')))
          ")
            REMAINING=$((TOTAL - DONE))
            echo "Total: $TOTAL, Done: $DONE, Remaining: $REMAINING"
            if [ "$REMAINING" -gt 0 ]; then
              echo "Triggering next run..."
              curl -X POST \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: token $GITHUB_TOKEN" \
                https://api.github.com/repos/${{ github.repository }}/actions/workflows/baosi.yml/dispatches \
                -d '{"ref":"main"}'
            else
              echo "All tasks completed!"
            fi
          fi

      - name: Upload output files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baosi-output-${{ github.run_number }}
          path: |
            compressors_baosi*.js
            baosi_gen_progress*.json
            baosi_gen*.log
            baosi_probe*.log
          retention-days: 30
